name: CI pour le projet Django

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lancer les tests unitaires
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: 1. Checkout du code
        uses: actions/checkout@v4

      - name: 2. Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 3. Cache des dépendances pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 4. Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: my_api_project

      - name: 5. Exécution du linter (flake8)
        run: |
          # On exécute flake8 sur tout le projet. Les options sont expliquées ci-dessous.
          # Cette commande va échouer si des erreurs de style sont trouvées.
          flake8 . --count --show-source --statistics
        working-directory: my_api_project

      - name: 6. Exécution des tests
        run: |
          python manage.py test
        working-directory: my_api_project
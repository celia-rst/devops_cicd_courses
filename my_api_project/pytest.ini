[pytest]
# Indique à Pytest où trouver les settings de votre projet Django.
# Remplacez 'myproject.settings' par le chemin exact vers vos propres settings.
DJANGO_SETTINGS_MODULE = myproject.settings

# Spécifie les patterns de fichiers que Pytest doit considérer comme des tests.
# Cette configuration est la convention standard de l'écosystème.
python_files = test_*.py *_test.py tests.py